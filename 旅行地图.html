*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:13px}
header{height:60px;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line)}
h1{font-size:16px;font-weight:600;margin:0;white-space:nowrap}
.tabs,.subtabs{display:flex;gap:6px}
.tab,.subtab{min-height:36px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--sub);cursor:pointer;font-size:13px;font-family:inherit;white-space:nowrap}
.tab.on{background:var(--pri-deep);border-color:var(--pri-deep);color:#fff}
.subtab{font-size:12px;border-radius:8px}
.subtab.on{background:var(--hover);border-color:var(--pri);color:var(--pri-deep)}
.stat{margin-left:auto;color:var(--sub);font-size:12px;white-space:nowrap}
.clear{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--sub);cursor:pointer;font-family:inherit;font-size:12px}
main{display:flex;gap:12px;padding:12px;height:calc(100% - 60px)}
aside{width:290px;flex:none;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.aside-h{padding:12px 14px 8px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line)}
.searchwrap{display:none;padding:8px 10px;border-bottom:1px solid var(--line)}
.searchwrap.show{display:block}
#search{width:100%;min-height:36px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;background:var(--card);color:var(--ink)}
.hint{font-size:11px;color:var(--sub);line-height:1.6;padding:8px 14px;margin:0}
#list{overflow-y:auto;flex:1;padding:4px 8px 12px}
.grp{border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px}
.grp-h{display:flex;justify-content:space-between;padding:8px 8px 3px;font-size:11px;color:var(--sub)}
.place{display:flex;align-items:center;gap:9px;width:100%;min-height:40px;padding:5px 8px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--ink);cursor:pointer;font-family:inherit;font-size:13px;text-align:left}
.place:hover{background:var(--hover)}
.place .dot{width:12px;height:12px;border-radius:50%;border:2px solid #aab4c4;background:transparent;flex:none}
.place.on .dot{border-color:var(--pri);background:var(--pri);box-shadow:0 0 0 3px rgba(79,124,255,.18)}
.place .nm{flex:1;min-width:0}
.place.on .nm{font-weight:600;color:var(--pri-deep)}
.place .meta{font-size:11px;color:var(--sub)}
#mapWrap{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#eef2f8}
#map{width:100%;height:100%}
.prow{display:flex;align-items:center;gap:2px}
.prow .place{flex:1;min-width:0}
.dbtn{flex:none;min-width:36px;min-height:32px;padding:0 6px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--sub);font-size:11px;font-family:inherit;cursor:pointer;white-space:nowrap}
.dbtn:hover{background:var(--hover);color:var(--pri-deep);border-color:var(--pri)}
.dbtn.has{color:var(--pri-deep);border-color:rgba(79,124,255,.42);background:rgba(79,124,255,.08)}

.diary-mask.show{display:flex}
.diary-panel{width:min(580px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 12px 44px rgba(20,26,40,.2)}
.diary-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.diary-h b{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.diary-x{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--sub);cursor:pointer;font-size:16px;font-family:inherit;line-height:1}
.diary-body{overflow-y:auto;padding:12px 16px;flex:1;min-height:80px}
.diary-empty{color:var(--sub);font-size:12px;text-align:center;padding:18px 8px}
.dentry{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:9px;background:var(--card)}
.dentry .eh{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--sub)}
.dentry .eh b{font-size:13px;color:var(--ink);font-weight:600}
.dentry .eh .sp{flex:1}
.dentry p{margin:6px 0 0;font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.dphotos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dphotos img{width:74px;height:74px;object-fit:cover;border-radius:7px;border:1px solid var(--line);background:var(--bg);cursor:zoom-in}
.dmini{min-height:26px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--sub);font-size:11px;font-family:inherit;cursor:pointer}
.dmini:hover{color:var(--pri-deep);border-color:var(--pri)}
.dform{border-top:1px solid var(--line);padding:11px 16px 14px;background:var(--bg)}
.dform label{display:block;font-size:11px;color:var(--sub);margin:0 0 3px}
.dform input[type=date],.dform input[type=text],.dform textarea{width:100%;min-height:34px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;background:var(--card);color:var(--ink);margin-bottom:7px}
.dform textarea{min-height:66px;resize:vertical}
.drow{display:flex;gap:8px}.drow>*{flex:1;min-width:0}
.dact{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dact .btn{min-height:34px;padding:0 13px;border-radius:8px;font-family:inherit;font-size:12px;cursor:pointer}
.dact .pri{background:var(--pri-deep);border:1px solid var(--pri-deep);color:#fff}
.dact .gh{background:transparent;border:1px solid var(--line);color:var(--sub)}
#dFile{font-size:11px;max-width:190px}
.dthumbs{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0}
.dthumbs div{position:relative}
.dthumbs img{width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.dthumbs button{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:11px;line-height:1;cursor:pointer;padding:0}
@media(max-width:680px){
  header{height:auto;min-height:56px;flex-wrap:wrap;padding:8px 12px;gap:8px}
  h1{font-size:15px;width:100%}

  .tab,.subtab,.clear{min-height:44px}

  aside{width:100%;height:34vh;flex:none}
  #mapWrap{height:52vh;flex:none}
}
</style>

const DIARY_DB='wb_travel_diary_db';
let _dbp=null;
function openDB(){
  if(_dbp)return _dbp;
  _dbp=new Promise((res,rej)=>{
    let req;
    try{req=indexedDB.open(DIARY_DB,1);}catch(e){rej(e);return;}
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains('diaries')){
        const s=db.createObjectStore('diaries',{keyPath:'id'});
        s.createIndex('placeId','placeId',{unique:false});
      }
      if(!db.objectStoreNames.contains('photos')){
        const s=db.createObjectStore('photos',{keyPath:'id'});
        s.createIndex('diaryId','diaryId',{unique:false});
      }
    };
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
    req.onblocked=()=>rej(new Error('db blocked'));
  });
  return _dbp;
}
function idbAll(store){
  return openDB().then(db=>new Promise((res,rej)=>{
    const r=db.transaction(store,'readonly').objectStore(store).getAll();
    r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);
  }));
}
function idbGet(store,key){
  return openDB().then(db=>new Promise((res,rej)=>{
    const r=db.transaction(store,'readonly').objectStore(store).get(key);
    r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);
  }));
}
function idbPut(store,val){
  return openDB().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(store,'readwrite');
    const r=tx.objectStore(store).put(val);
    tx.oncomplete=()=>res(r.result);tx.onerror=()=>rej(tx.error);
  }));
}
function idbDel(store,key){
  return openDB().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(store,'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);
  }));
}

function syncParent(pid,on){
  const arr=state[parentBucket()];
  if(on){if(arr.indexOf(pid)<0)arr.push(pid);}
  else{
    const still=childList().some(c=>c[parentKey()]===pid&&state[childBucket()].includes(c.id));
    if(!still){const i=arr.indexOf(pid);if(i>=0)arr.splice(i,1);}
  }
}
function toggle(id){

    const c=childList().find(x=>x.id===id);
    const arr=state[childBucket()];
    const i=arr.indexOf(id);
    if(i>=0){arr.splice(i,1);if(c)syncParent(c[parentKey()],false);}
    else{arr.push(id);if(c)syncParent(c[parentKey()],true);}
  }else{
    const arr=state[parentBucket()], i=arr.indexOf(id);

function _diaryTrapFocus(e){
  if(e.key!=='Tab'||!diaryMaskEl.classList.contains('show'))return;
  const panel=diaryMaskEl.querySelector('.diary-panel');
  if(!panel)return;
  const f=Array.prototype.slice.call(panel.querySelectorAll('button:not([disabled]),input:not([type="hidden"]):not([disabled]),textarea:not([disabled]),select:not([disabled]),a[href]'));
  if(!f.length)return;
  const first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  else if(!panel.contains(document.activeElement)){e.preventDefault();first.focus();}
}

function makeThumb(file){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        try{
          const max=200,scale=Math.min(1,max/Math.max(img.width,img.height)||1);
          const c=document.createElement('canvas');
          c.width=Math.max(1,Math.round(img.width*scale));
          c.height=Math.max(1,Math.round(img.height*scale));
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          res(c.toDataURL('image/jpeg',0.72));
        }catch(e){res('');}
      };
      img.onerror=()=>res('');
      img.src=fr.result;
    };
    fr.onerror=()=>res('');
    fr.readAsDataURL(file);
  });
}

      ov.addEventListener('click',()=>{ov.style.display='none';});
      document.body.appendChild(ov);
    }

  });

    document.body.appendChild(t);
  }
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(t._t);t._t=setTimeout(()=>{t.style.opacity='0';},1800);
}

document.getElementById('dClose').addEventListener('click',closeDiary);
document.getElementById('dCancel').addEventListener('click',closeDiary);
diaryMaskEl.addEventListener('click',e=>{if(e.target===diaryMaskEl)closeDiary();});
document.addEventListener('keydown',e=>{
  if(e.key==='Tab'){_diaryTrapFocus(e);return;}   /* S-1：Tab 在弹窗内回环 */
  if(e.key==='Escape'&&diaryMaskEl.classList.contains('show'))closeDiary();
});
dListEl.addEventListener('click',e=>{
  const ed=e.target.closest('[data-edit]');if(ed){fillForm(ed.dataset.edit);return;}
  const dl=e.target.closest('[data-del]');if(dl){deleteDiary(dl.dataset.del);return;}
  const ph=e.target.closest('[data-photo]');if(ph){viewPhoto(ph.dataset.photo);}
});
dThumbsEl.addEventListener('click',e=>{
  const rp=e.target.closest('[data-rmphoto]');
  if(rp){pendingPhotos=pendingPhotos.filter(p=>p.id!==rp.dataset.rmphoto);renderPending();return;}
  const re=e.target.closest('[data-rmexist]');
  if(re){const pid=re.dataset.rmexist;removedPhotoIds.push(pid);existingPhotoIds=existingPhotoIds.filter(x=>x!==pid);renderPending();}
});
dFileEl.addEventListener('change',()=>{
  const files=Array.from(dFileEl.files||[]).filter(f=>/^image\//.test(f.type));
  files.forEach(f=>{
    if(f.size>MAX_PHOTO){toast('「'+(f.name||'照片')+'」超过 12MB，已跳过，请压缩后再传');return;}  /* S-5 */
    const pid=uid('ph');
    const job=makeThumb(f).then(thumb=>{  /* S-3：收集异步任务，submit 时统一等待 */
      pendingPhotos.push({id:pid,blob:f,thumb,name:f.name,type:f.type,size:f.size});
      renderPending();
    });
    pendingThumbJobs.push(job);
  });
  dFileEl.value='';
});
document.getElementById('dForm').addEventListener('submit',e=>{
  e.preventDefault();
  if(saving)return;                 /* S-4：幂等锁，防双击/重复提交生成多篇日记 */
  saving=true;
  const editId=document.getElementById('dEdit').value||'';
  const date=document.getElementById('dDate').value;
  const title=document.getElementById('dTitleIn').value.trim();
  const text=document.getElementById('dText').value.trim();
  const did=editId||uid('d');
  Promise.all(pendingThumbJobs).then(()=>{  /* S-3：等全部异步缩略图就绪，避免新照片漏存 */
    const jobs=pendingPhotos.map(p=>idbPut('photos',{
      id:p.id,diaryId:did,blob:p.blob,thumb:p.thumb,name:p.name,type:p.type,size:p.size,createdAt:Date.now()
    }));
    removedPhotoIds.forEach(pid=>jobs.push(idbDel('photos',pid)));
    return Promise.all(jobs);
  }).then(()=>{
    return idbPut('diaries',{
      id:did,placeId:curPlace.id,placeName:curPlace.name,region,level,
      date,title,text,photoIds:existingPhotoIds.slice().concat(pendingPhotos.map(p=>p.id)),
      createdAt:(editId&&editingMeta.createdAt)||Date.now(),updatedAt:Date.now()
    });
  }).then(()=>{resetForm();return loadDiaries();})
    .then(()=>{toast('日记已保存');})
    .catch(()=>{toast('保存失败，请检查浏览器本地存储权限');})
    .finally(()=>{saving=false;});  /* S-4：无论成功失败都释放锁 */
});
refreshCounts();
</script>
