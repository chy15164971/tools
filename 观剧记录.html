<style>
  /* === 观剧页私有 token（写在 SHARED TOKENS 标记区之外，sync_tokens.js 不触碰）=== */
  :root{--warm:#F5A623}
  /* === SHARED TOKENS START === */
  :root{
    --bg:#f5f7fb; --card:#ffffff; --ink:#1f2430; --text:#1f2430; --sub:#6b7280; --line:#e7ebf2;
    /* --pri-ink：主色当**文字**用（#4F7CFF 白底仅 3.71:1 不达标）→ 5.48:1
       --pri-deep：主色当**底色**、上面压白色小字（12.5–14px 不到大文本门槛）→ 4.73:1
       纯填充（进度条/图标/色点）继续用 --pri，不受影响。 */
    --pri-ink:#2F5FE0; --pri-deep:#3D68F0;
    --pri:#4F7CFF; --pri-soft:#eaf0ff; --ok:#22b07d; --ok-soft:#e7f6ec; --warn:#ff8a3d; --danger:#ef4444;
    /* 语义色三件套（2026-11-22 批三补）：--x 只做填充，文字一律用 --x-ink 压在 --x-soft 上。
       起因：状态胶囊/徽章此前是「品牌色底 + 白字」，实测 --ok 底白字 2.77:1、深色 --ok 底白字
       仅 1.90:1；而 11–12.5px 的状态文字恰是用户最需要一眼读准的内容。
       数值：ok-ink 4.58:1 / warn-ink 4.86:1 / danger-ink 5.15:1（压各自 soft 底，均过 AA 4.5:1）。 */
    --ok-ink:#167d55; --warn-soft:#fff5e6; --warn-ink:#a25a0f; --danger-soft:#fdecec; --danger-ink:#c62828;
    /* 数据色（c4 媒体剧集 / c5 兜底灰在用；c1~c3 已删除，分类/优先级用用户自定义色） */
    --c4:#ff5c8a; --c5:#9aa0ab; --c6:#9b6bff;
    --chip-bg:#6b7280;
    --radius:12px; --radius-sm:8px; --radius-lg:16px; --shadow:0 2px 10px rgba(31,36,48,.06);
    /* cloudpill / 菜单 hover 此前引用未定义值导致样式退化，统一补全 */
    --bg2:#f5f7fb; --muted:#6b7280; --hover:#f4f6fb; --soft:#f1f4f9;
  --accent:#7c5cff; --white:#fff; --ink-strong:#1f2430; }
  [data-theme="dark"]{
    --bg:#0f1320; --card:#171c2b; --ink:#e7ebf3; --text:#e7ebf3; --sub:#9aa3b2; --line:#262d3f;
    --pri-ink:#8FABFF; --pri-deep:#3D68F0;
    --pri:#5b86ff; --pri-soft:#1c2740; --hover:#1c2236; --bg2:#11162a; --muted:#9aa3b2;
    --ok:#2dd4a0; --ok-soft:#10312a; --warn:#ff9a52; --danger:#ff5d5d;
    /* 深色语义色三件套：底色翻深、ink 翻浅，同样保证压 --x-soft 时 ≥4.5:1
       （ok-ink 7.38 / warn-ink 8.84 / danger-ink 5.19） */
    --ok-ink:#2dd4a0; --warn-soft:#33240f; --warn-ink:#ffb877; --danger-soft:#3a1a1c; --danger-ink:#ff5d5d;
    --c4:#ff7aa6; --c5:#5a6478; --c6:#b08cff;
    /* 深色下 --muted 是浅灰（#9aa3b2），压白字只有 ~2.4:1 → chip 底色另给一个深灰 */
    --chip-bg:#5a6478;
    --shadow:0 2px 10px rgba(0,0,0,.32);
    --soft:#1c2233;
  --accent:#9b8cff;
  /* G19（2026-10-23 修）：dark 补定义 --ink-strong —— 原漏覆盖仍为亮色值 #1f2430，
     深色下 .today-sec-act:hover 等引用处深字压深底近乎隐形 */
  --ink-strong:#e7ebf3; }
  /* === SHARED TOKENS END === */
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.5}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0;position:sticky;top:0;z-index:20}
.h-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:17px;font-weight:600;margin:0;white-space:nowrap}
.h-sub{color:var(--sub);font-size:12px}
.spacer{flex:1}
.btn{min-height:36px;padding:0 13px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--pri);color:var(--pri-deep)}
.btn.pri{background:var(--pri-deep);border-color:var(--pri-deep);color:#fff}
.btn.pri:hover{background:#3359d8;color:#fff}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.tab{min-height:38px;padding:0 15px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--sub);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--pri-deep);border-bottom-color:var(--pri-deep);font-weight:600}
main{max-width:1360px;margin:0 auto;padding:16px}   /* 20261122：1080→1360，对齐任务台/明信片/海报墙/home 的全站容器基准，切页不再宽度跳变 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.stat .n{font-size:24px;font-weight:700;color:var(--pri-deep);line-height:1.1}
.stat .l{font-size:11px;color:var(--sub);margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.panel h2{font-size:14px;margin:0 0 12px;font-weight:600}
.empty{text-align:center;color:var(--sub);padding:36px 12px;font-size:13px}
.empty .big{font-size:32px;opacity:.35;margin-bottom:8px}
/* 记录卡 */
.rec{border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:10px;background:var(--card)}
.rec:hover{border-color:#cdd6f5}
.rec .rh{display:flex;align-items:flex-start;gap:8px}
.rec .rt{font-size:15px;font-weight:600;flex:1;min-width:0}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;background:var(--hover);color:var(--pri-deep);white-space:nowrap}
.rec .rmeta{color:var(--sub);font-size:11px;margin-top:5px;display:flex;gap:12px;flex-wrap:wrap}
.rec .rtext{margin:8px 0 0;font-size:13px;white-space:pre-wrap;word-break:break-word}
.stars{color:var(--warm);font-size:13px;letter-spacing:1px}
.rphotos{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.rphotos img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.ract{display:flex;gap:6px;margin-top:9px}
.mini{min-height:26px;padding:0 9px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--sub);font:inherit;font-size:11px;cursor:pointer}
.mini:hover{color:var(--pri-deep);border-color:var(--pri)}
.mini.del:hover{color:var(--danger);border-color:var(--danger)}
/* 统计图 */
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:88px 1fr 42px;align-items:center;gap:10px;font-size:12px}
.bar-track{height:14px;background:var(--bg);border-radius:7px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#4F7CFF,#7BA0FF);border-radius:7px;min-width:2px;transition:width .4s}
.bar-row .bv{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* 观演日历（O-1） */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-head b{flex:1;text-align:center;font-size:15px;font-variant-numeric:tabular-nums}
.cal-nav{width:32px;height:32px;flex:none;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--sub);font:inherit;font-size:15px;line-height:1;cursor:pointer}
.cal-nav:hover{color:var(--pri-ink);border-color:var(--pri)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-wd{text-align:center;font-size:10px;color:var(--sub);padding:3px 0}
.cal-cell{position:relative;min-height:40px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.cal-cell.is-empty{background:transparent}
.cal-cell.has-rec{background:var(--pri-soft);color:var(--pri-ink);font-weight:700;cursor:pointer}  /* 主色当文字必须用 --pri-ink：--pri-deep 在 --pri-soft 上亮色仅 4.15:1、暗色 3.14:1 不达 AA */
.cal-cell.is-today{box-shadow:inset 0 0 0 1px var(--pri)}
.cal-cell.sel{box-shadow:inset 0 0 0 2px var(--pri)}
.cal-cell .cal-dot{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--pri)}
.cal-sum{margin-top:12px;font-size:12px;color:var(--sub)}
.cal-sum b{color:var(--pri-ink)}
.cal-day{margin-top:14px}
.cal-day h2{font-size:14px;margin:0 0 9px}
/* 想看 */
.wish{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px}
.wish .wt{flex:1;min-width:0}
.wish .wt b{font-weight:600}
.wish .wt span{color:var(--sub);font-size:11px;margin-left:6px}
.wish.done .wt b{text-decoration:line-through;color:var(--sub)}
/* 推荐 */
.reco{border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:9px;display:flex;gap:12px;align-items:flex-start}
.reco .rank{width:28px;height:28px;flex:none;border-radius:8px;background:var(--hover);color:var(--pri-deep);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.reco .rb{flex:1;min-width:0}
.reco .rb b{font-size:14px}
.reco .why{color:var(--sub);font-size:11px;margin-top:5px}
.reco .tags{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 7px;border-radius:5px;background:var(--bg);color:var(--sub)}
/* 弹窗 */
.mask{display:none;position:fixed;inset:0;z-index:50;background:rgba(20,26,40,.44);align-items:center;justify-content:center;padding:16px}
.mask.show{display:flex}
.panel-dialog{width:min(600px,100%);max-height:90vh;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 12px 44px rgba(20,26,40,.2)}
.dh{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.dh b{font-size:15px;flex:1}
.x{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--sub);cursor:pointer;font-size:16px;line-height:1}
.db{overflow-y:auto;padding:14px 16px;flex:1}
.form label{display:block;font-size:11px;color:var(--sub);margin:0 0 3px}
.form input[type=text],.form input[type=date],.form input[type=number],.form select,.form textarea{width:100%;min-height:36px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;background:var(--card);color:var(--ink);margin-bottom:9px}
.form textarea{min-height:70px;resize:vertical}
.frow{display:flex;gap:9px}.frow>*{flex:1;min-width:0}
.form input[type=file]{font-size:11px;max-width:100%;margin-bottom:6px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.thumbs div{position:relative}
.thumbs img{width:54px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:11px;line-height:1;cursor:pointer;padding:0}
.dact{display:flex;gap:8px;padding:11px 16px;border-top:1px solid var(--line);background:var(--bg)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;display:flex;align-items:center;gap:12px}  /* 批三：color:#fff 深色主题压浅字底 ~1.9:1，改取 --bg 自动反转 */
.toast.has-act{pointer-events:auto}
.toast .tact{border:0;background:transparent;color:var(--pri-ink);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:0}  /* 批三：#8ab4ff 是写死的亮蓝，深色主题压浅底不足 3:1；--pri-ink 双主题反转 */
.toast .tact:hover{text-decoration:underline}
@media(max-width:680px){
  header{padding:12px 12px 0}
  h1{font-size:15px}
  .h-sub{display:none}
  main{padding:10px}
  .stats{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .btn{min-height:44px}
  .tab{min-height:44px}
  .bar-row{grid-template-columns:70px 1fr 36px}
}
</style>
</head>

<header>
  <div class="h-top">
    <h1>观剧记录</h1>
    <span class="h-sub">记录每一次走进剧场的现场，累积属于你的剧历</span>
    <span class="spacer"></span>
    <button class="btn pri" id="addRec" type="button">+ 记一场</button>
    <button class="btn" id="addWish" type="button">+ 想看</button>

    <button class="tab" data-tab="reco" type="button">剧目推荐</button>
  </div>

  <div class="stats" id="statsBar"></div>

<div class="mask" id="mask">
  <div class="panel-dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="dh"><b id="dlgTitle">记一场</b><button class="x" id="dlgX" type="button" aria-label="关闭">×</button></div>

      <input type="hidden" id="fId">
      <div class="frow">
        <div><label for="fName">剧目名称 *</label><input type="text" id="fName" placeholder="如：哈姆雷特 / 歌剧魅影"></div>
        <div><label for="fType">类型 *</label><select id="fType"></select></div>
      </div>

<!-- S-9：Promise 化确认/输入弹窗，替代原生 confirm/prompt（原生弹窗在部分 PWA/内嵌环境会被拦截） -->

<script>
/* ===== 数据层 ===== */
const KEY='wb_theatre_v1';
const TYPES=['话剧','音乐剧','舞剧','戏曲','演唱会','音乐会','魔术马戏','其他'];
let data={records:[],wishlist:[]};
try{
  const s=JSON.parse(localStorage.getItem(KEY)||'null');
  if(s&&typeof s==='object'){
    data={records:Array.isArray(s.records)?s.records:[],wishlist:Array.isArray(s.wishlist)?s.wishlist:[]};
  }
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){toast('本地存储写入失败');}}

/* IndexedDB：照片存原图 Blob + 缩略图 */
const DB='wb_theatre_db';
let _dbp=null;
function openDB(){
  if(_dbp)return _dbp;
  _dbp=new Promise((res,rej)=>{
    let q;try{q=indexedDB.open(DB,1);}catch(e){rej(e);return;}
    q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'});};
    q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);q.onblocked=()=>rej(new Error('db blocked'));
  });
  return _dbp;
}
function idbAll(){return openDB().then(db=>new Promise((res,rej)=>{const r=db.transaction('photos').objectStore('photos').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);}));}
/* 2026-11-22 审查：删除记录时 Promise.all(ids.map(idG=>idbGet(id))) 调用了本函数，
   但此前全页只有 idbAll/idbPut/idbDel —— 带照片的记录一删就 ReferenceError，删除静默失效。 */
function idbGet(k){return openDB().then(db=>new Promise((res,rej)=>{const r=db.transaction('photos').objectStore('photos').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));}
function idbPut(v){return openDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(v);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);}));}
function idbDel(k){return openDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);}));}
function uid(p){return (p||'r')+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);}
/* M-5（2026-11-21 批一）：本地日期，避免 toISOString() 在东八区 00:00-08:00 写成前一天 */
function localDate(d){
  d=d||new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function stars(n){n=Number(n)||0;return '★'.repeat(n)+'☆'.repeat(5-n);}

/* 内置剧目库（本地推荐用，离线可用） */
const LIB=[
  {n:'哈姆雷特',t:'话剧',tags:['经典','莎士比亚','悲剧']},
  {n:'茶馆',t:'话剧',tags:['经典','老舍','京味']},
  {n:'雷雨',t:'话剧',tags:['经典','曹禺','家庭']},

  {n:'活着',t:'话剧',tags:['改编','余华','史诗']},
  {n:'平凡的世界',t:'话剧',tags:['改编','现实主义']},
  {n:'歌剧魅影',t:'音乐剧',tags:['经典','韦伯','爱情']},
  {n:'猫',t:'音乐剧',tags:['经典','韦伯','歌舞']},
  {n:'悲惨世界',t:'音乐剧',tags:['经典','雨果','史诗']},
  {n:'西区故事',t:'音乐剧',tags:['经典','爱情','歌舞']},
  {n:'妈妈咪呀',t:'音乐剧',tags:['轻松','ABBA','喜剧']},
  {n:'剧院魅影：真爱不死',t:'音乐剧',tags:['续集','韦伯']},
  {n:'我的祖国',t:'音乐剧',tags:['中文原创','现实']},
  {n:'永不消逝的电波',t:'舞剧',tags:['红色','谍战','口碑']},
  {n:'只此青绿',t:'舞剧',tags:['国风','宋韵','爆款']},
  {n:'朱鹮',t:'舞剧',tags:['国风','唯美']},
  {n:'天鹅湖',t:'舞剧',tags:['经典','芭蕾','柴可夫斯基']},
  {n:'红色娘子军',t:'舞剧',tags:['经典','芭蕾','红色']},
  {n:'牡丹亭',t:'戏曲',tags:['昆曲','经典','爱情']},
  {n:'霸王别姬',t:'戏曲',tags:['京剧','经典','悲剧']},
  {n:'天仙配',t:'戏曲',tags:['黄梅戏','经典']},
  {n:'梁山伯与祝英台',t:'戏曲',tags:['越剧','经典','爱情']},
  {n:' ERA——时空之旅',t:'魔术马戏',tags:['舞台秀','视觉','上海']},
  {n:'宋城千古情',t:'魔术马戏',tags:['实景','歌舞','旅游']},
  {n:'维也纳新年音乐会',t:'音乐会',tags:['古典','新年','维也纳']},
  {n:'久石让作品音乐会',t:'音乐会',tags:['动漫','治愈','久石让']}
];

let thumbsCache=Object.create(null);
function loadThumbs(){return idbAll().then(ps=>{thumbsCache=Object.create(null);ps.forEach(p=>thumbsCache[p.id]=p.thumb);}).catch(()=>{});}

/* ===== 渲染 ===== */
let curTab='records';
/* O-1：观演日历当前年月与选中日期（周一为第一列） */
let calY=new Date().getFullYear(),calM=new Date().getMonth(),calSel='';
const view=document.getElementById('view');
const statsBar=document.getElementById('statsBar');

function renderStats(){
  const rs=data.records;
  const total=rs.length;
  const spend=rs.reduce((s,r)=>s+(Number(r.price)||0),0);
  const venues=new Set(rs.map(r=>r.venue).filter(Boolean)).size;
  const year=new Date().getFullYear();
  const thisYear=rs.filter(r=>String(r.date||'').startsWith(String(year))).length;
  statsBar.innerHTML=[
    ['累计观演',total+' 场'],
    [year+' 年',thisYear+' 场'],
    ['到访剧院',venues+' 家'],
    ['累计票价','¥ '+spend.toLocaleString()]
  ].map(x=>'<div class="stat"><div class="n">'+esc(x[1])+'</div><div class="l">'+esc(x[0])+'</div></div>').join('');
}
function recHtml(r){
  const imgs=(r.photoIds||[]).map(id=>thumbsCache[id]?'<img src="'+esc(thumbsCache[id])+'" data-photo="'+esc(id)+'" alt="现场照片">':'').join('');
  return '<div class="rec" data-rec="'+esc(r.id)+'">'
    +'<div class="rh"><div class="rt">'+esc(r.name)+'</div><span class="badge">'+esc(r.type||'其他')+'</span><span class="stars">'+stars(r.rating)+'</span></div>'
    +'<div class="rmeta">'+(r.date?'<span>'+esc(r.date)+'</span>':'')+(r.venue?'<span>'+esc(r.venue)+'</span>':'')+(r.city?'<span>'+esc(r.city)+'</span>':'')+(r.session?'<span>'+esc(r.session)+'</span>':'')+(Number(r.price)>0?'<span>¥'+Number(r.price)+'</span>':'')+'</div>'
    +(r.note?'<p class="rtext">'+esc(r.note)+'</p>':'')
    +(imgs?'<div class="rphotos">'+imgs+'</div>':'')
    +'<div class="ract"><button class="mini" data-edit="'+esc(r.id)+'" type="button">编辑</button><button class="mini del" data-del="'+esc(r.id)+'" type="button">删除</button></div>'
    +'</div>';
}
function renderRecords(){
  if(!data.records.length){view.innerHTML='<div class="panel"><div class="empty"><div class="big">◎</div>还没有观演记录，点右上角「记一场」开始你的剧历。</div></div>';return;}
  const sorted=data.records.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  view.innerHTML='<div class="panel"><h2>观演记录 · '+sorted.length+' 场</h2>'+sorted.map(recHtml).join('')+'</div>';
}
function groupBars(counts){
  const arr=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if(!arr.length)return '<div class="empty">暂无数据</div>';
  const max=Math.max.apply(null,arr.map(x=>x[1]));
  return '<div class="bars">'+arr.map(([k,v])=>'<div class="bar-row"><span>'+esc(k)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(v/max*100)+'%"></div></div><span class="bv">'+v+'</span></div>').join('')+'</div>';
}
function countBy(key){const m={};data.records.forEach(r=>{const k=r[key]||'未填写';m[k]=(m[k]||0)+1;});return m;}
function renderStatsView(){
  const years={};data.records.forEach(r=>{const y=String(r.date||'').slice(0,4)||'未填写';years[y]=(years[y]||0)+1;});
  const venues={};data.records.forEach(r=>{if(r.venue)venues[r.venue]=(venues[r.venue]||0)+1;});
  const types=countBy('type');
  view.innerHTML='<div class="grid2">'
    +'<div class="panel"><h2>按剧目类型</h2>'+groupBars(types)+'</div>'
    +'<div class="panel"><h2>按观演年份</h2>'+groupBars(years)+'</div>'
    +'<div class="panel"><h2>常去剧院 Top</h2>'+groupBars(venues)+'</div>'
    +'<div class="panel"><h2>观演小结</h2>'+summaryHtml()+'</div>'
    +'</div>';
}
function summaryHtml(){
  const rs=data.records;if(!rs.length)return '<div class="empty">暂无数据</div>';
  const prices=rs.map(r=>Number(r.price)||0).filter(x=>x>0);
  const avg=prices.length?Math.round(prices.reduce((a,b)=>a+b,0)/prices.length):0;
  const rated=rs.filter(r=>Number(r.rating)>0);
  const avgRate=rated.length?(rated.reduce((a,b)=>a+Number(b.rating),0)/rated.length).toFixed(1):'—';
  const top=Object.entries(countBy('type')).sort((a,b)=>b[1]-a[1])[0];
  return '<div style="font-size:13px;line-height:2">'
    +'· 最常看：<b>'+esc(top?top[0]:'—')+'</b>（'+(top?top[1]:0)+' 场）<br>'
    +'· 平均票价：<b>¥'+avg+'</b><br>'
    +'· 平均评分：<b>'+avgRate+'</b> / 5<br>'
    +'· 已评分场次：<b>'+rated.length+'</b> / '+rs.length
    +'</div>';
}
/* ===== O-1：观演日历视图（对标「剧在」的剧历，补时间轴视角） ===== */
function calMap(){
  const m=Object.create(null);
  data.records.forEach(r=>{const d=String(r.date||'');if(d.length>=10){const k=d.slice(0,10);(m[k]||(m[k]=[])).push(r);}});
  return m;
}
function renderCalendar(){
  const m=calMap();
  const pad=n=>String(n).padStart(2,'0');
  const ym=calY+'-'+pad(calM+1);
  const startDow=(new Date(calY,calM,1).getDay()+6)%7;   /* 周一为第一列 */
  const days=new Date(calY,calM+1,0).getDate();
  const today=localDate(new Date());
  let cells='';
  for(let i=0;i<startDow;i++)cells+='<div class="cal-cell is-empty"></div>';
  for(let d=1;d<=days;d++){
    const key=ym+'-'+pad(d);
    const n=(m[key]||[]).length;
    cells+='<div class="cal-cell'+(n?' has-rec':'')+(key===today?' is-today':'')+(key===calSel?' sel':'')+'" data-cal="'+key+'"'
      +(n?' role="button" tabindex="0" aria-label="'+key+' 有 '+n+' 场观演"':'')+'>'+d
      +(n?'<span class="cal-dot"></span>':'')+'</div>';
  }
  const monthCount=Object.keys(m).filter(k=>k.slice(0,7)===ym).reduce((s,k)=>s+m[k].length,0);
  const selList=calSel?(m[calSel]||[]):[];
  view.innerHTML='<div class="panel">'
    +'<div class="cal-head">'
    +'<button class="cal-nav" data-calprev type="button" aria-label="上一月">‹</button>'
    +'<b>'+calY+' 年 '+(calM+1)+' 月</b>'
    +'<button class="cal-nav" data-calnext type="button" aria-label="下一月">›</button>'
    +'</div>'
    +'<div class="cal-grid">'+['一','二','三','四','五','六','日'].map(w=>'<div class="cal-wd">'+w+'</div>').join('')+cells+'</div>'
    +'<div class="cal-sum">本月 <b>'+monthCount+'</b> 场 · 剧历累计 '+data.records.length+' 场 · 点有圆点的日期看当日剧目</div>'
    +(calSel?'<div class="cal-day"><h2>'+esc(calSel)+' · '+selList.length+' 场</h2>'+(selList.length?selList.map(recHtml).join(''):'<div class="empty">这天没有观演记录</div>')+'</div>':'')
    +'</div>';
}
function renderWish(){
  if(!data.wishlist.length){view.innerHTML='<div class="panel"><div class="empty"><div class="big">☆</div>想看的剧目加入这里，之后可以转成观演记录。</div></div>';return;}
  view.innerHTML='<div class="panel"><h2>想看清单 · '+data.wishlist.length+' 部</h2>'+data.wishlist.map(w=>
    '<div class="wish'+(w.done?' done':'')+'">'
    +'<input type="checkbox" data-wdone="'+esc(w.id)+'" '+(w.done?'checked':'')+' aria-label="标记已看">'
    +'<div class="wt"><b>'+esc(w.name)+'</b>'+(w.type?'<span>'+esc(w.type)+'</span>':'')+(w.note?'<span>'+esc(w.note)+'</span>':'')+'</div>'
    +'<button class="mini" data-watch="'+esc(w.id)+'" type="button">转为记录</button>'
    +'<button class="mini del" data-wdel="'+esc(w.id)+'" type="button">删除</button>'
    +'</div>').join('')+'</div>';
}
/* 推荐：基于类型偏好 + 评分加成 + 确定性排序，排除已看 */
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
function normName(s){return String(s||'').replace(/[\s（）()【】\[\]《》]/g,'').replace(/二刷|三刷|重看|复刷/g,'');}
function renderReco(){
  const seen=data.records.map(r=>normName(r.name));
  const typeScore={};data.records.forEach(r=>{if(r.type)typeScore[r.type]=(typeScore[r.type]||0)+1+(Number(r.rating)||0)*0.3;});
  const pool=LIB.filter(x=>{const n=normName(x.n);return !seen.some(s=>s&&(s===n||(n.length>=2&&s.includes(n))||(s.length>=2&&n.includes(s))));});  /* S-8：双向去重，避免「歌剧魅影（二刷）」与库中短名互相漏判 */
  const scored=pool.map(x=>({x,s:(typeScore[x.t]||0)*3+hash(x.n)%7*0.1})).sort((a,b)=>b.s-a.s).slice(0,6);
  if(!scored.length){view.innerHTML='<div class="panel"><div class="empty">剧目库里的剧都看过了，太厉害了！</div></div>';return;}
  const fav=Object.entries(typeScore).sort((a,b)=>b[1]-a[1])[0];
  view.innerHTML='<div class="panel"><h2>为你推荐</h2>'
    +'<p style="color:var(--sub);font-size:12px;margin:0 0 12px">'
    +(fav?'根据你的观演偏好（偏爱'+esc(fav[0])+'）生成，纯本地计算，离线可用。':'根据内置剧目库生成，记录几场后推荐会更贴合你的口味。')
    +'</p>'
    +scored.map((o,i)=>'<div class="reco"><div class="rank">'+(i+1)+'</div><div class="rb"><b>'+esc(o.x.n)+'</b> <span class="badge">'+esc(o.x.t)+'</span>'
      +'<div class="tags">'+o.x.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>'
      +'<div class="why">'+(typeScore[o.x.t]?'你看过 '+Math.round(typeScore[o.x.t])+' 场'+esc(o.x.t)+'，可能会喜欢这类':'拓展新类型，丰富剧历')+'</div>'
      +'</div><button class="mini" data-addwish="'+esc(o.x.n)+'" type="button">+ 想看</button></div>').join('')
    +'</div>';
}
function renderAll(){renderStats();loadThumbs().then(()=>{
  if(curTab==='records')renderRecords();
  else if(curTab==='stats')renderStatsView();
  else if(curTab==='cal')renderCalendar();
  else if(curTab==='wish')renderWish();
  else renderReco();
});}

/* ===== 交互 ===== */
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('[data-tab]');if(!b)return;
  curTab=b.dataset.tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));
  renderAll();
});

/* 弹窗 */
const mask=document.getElementById('mask');
const fType=document.getElementById('fType');
TYPES.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;fType.appendChild(o);});
let pending=[];
function formSnapshot(){  /* S-7：表单脏检查快照 */
  return JSON.stringify({
    name:document.getElementById('fName').value,type:document.getElementById('fType').value,
    date:document.getElementById('fDate').value,venue:document.getElementById('fVenue').value,
    city:document.getElementById('fCity').value,price:document.getElementById('fPrice').value,
    session:document.getElementById('fSession').value,rating:document.getElementById('fRating').value,
    note:document.getElementById('fNote').value
  });
}
let _formBase='';
function isDirty(){return mask.classList.contains('show')&&formSnapshot()!==_formBase;}
async function closeDlg(force){  /* S-7：有未保存修改时先确认，避免长文误触丢失。注意事件绑定会传入 Event，必须显式判断 ===true */
  if(force!==true&&isDirty()){
    const ok=await askConfirm('有未保存的修改，确定关闭吗？');
    if(!ok)return;
  }
  mask.classList.remove('show');
}
function openDlg(rec){
  document.getElementById('fId').value=rec?rec.id:'';
  document.getElementById('dlgTitle').textContent=rec?'编辑观演记录':'记一场';
  document.getElementById('fName').value=rec?rec.name:'';
  fType.value=rec?rec.type:TYPES[0];
  document.getElementById('fDate').value=rec?rec.date:localDate();

let existingIds=[],removedIds=[];
function renderThumbs(){
  let h='';
  existingIds.forEach(id=>{h+='<div><img src="'+esc(thumbsCache[id]||'')+'" alt="已有照片"><button type="button" data-rex="'+esc(id)+'" aria-label="移除">×</button></div>';});

function makeThumb(file){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{const img=new Image();img.onload=()=>{
      try{const max=200,s=Math.min(1,max/Math.max(img.width,img.height)||1);const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72));}
      catch(e){res('');}
    };img.onerror=()=>res('');img.src=fr.result;};
    fr.onerror=()=>res('');fr.readAsDataURL(file);
  });
}

function toast(msg,action,cb,dur){  /* S-10：可选 action（撤销）按钮 */

/* ===== M-3（2026-11-21 批一）：导出 / 导入备份（含照片 base64），消除单点丢失 ===== */
function _blobToDataUrl(blob){
  return new Promise((res)=>{
    try{
      const fr=new FileReader();
      fr.onload=()=>res(typeof fr.result==='string'?fr.result:'');
      fr.onerror=()=>res('');
      fr.readAsDataURL(blob);
    }catch(e){res('');}
  });
}
function _dataUrlToBlob(u){
  try{
    const parts=String(u).split(',');
    const meta=parts[0]||''; const b64=parts[1]||'';
    /* 2026-11-22 审查：只认图片 dataURL。原实现对任意字符串都返回非空 Blob
       （atob('') 不抛），使伪造的 dataUrl 能一路存进库再拼进 <img src>。 */
    const mime=(meta.match(/^data:image\/(png|jpe?g|webp|gif);base64$/i)||[])[1];
    if(!mime || !b64) return null;
    const bin=atob(b64); const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    return new Blob([arr],{type:'image/'+mime.toLowerCase()});
  }catch(e){return null;}
}

      dataUrl:p.blob?await _blobToDataUrl(p.blob):(p.thumb||'')
    })));
  }catch(e){ /* 照片读取失败仍导出文本数据 */ }
  const payload={
    _app:'wb-theatre', _ver:1,

    records:data.records, wishlist:data.wishlist,
    photos:photos,

  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});

document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value='';
  if(!f) return;
  const rd=new FileReader();
  rd.onload=async()=>{
    let obj=null;
    try{ obj=JSON.parse(rd.result); }catch(_){}
    if(!obj || obj._app!=='wb-theatre' || !Array.isArray(obj.records)){
      toast('导入失败：不是有效的观剧备份文件'); return;
    }
    const recs=obj.records.filter(x=>x&&typeof x.name==='string'&&x.name.trim());
    const wish=Array.isArray(obj.wishlist)?obj.wishlist.filter(x=>x&&typeof x.name==='string'&&x.name.trim()):[];
    const ok=await askConfirm('导入将覆盖当前 '+data.records.length+' 条记录与 '+data.wishlist.length+' 项想看，确定继续？');  /* S-9 */
    if(!ok)return;
    data.records=recs; data.wishlist=wish; save();
    let restored=0;
    try{
      if(Array.isArray(obj.photos)){
        for(const p of obj.photos){
          if(!p||!p.id||!p.dataUrl) continue;
          const blob=_dataUrlToBlob(p.dataUrl);
          if(!blob) continue;
          const existing=await idbAll();
          if(existing.some(x=>x.id===p.id)) continue;   /* 幂等：已存在跳过 */
          await idbPut({id:p.id,recId:p.recId||'',blob:blob,thumb:p.dataUrl,name:p.name||'',type:p.type||'',size:blob.size,createdAt:p.createdAt||Date.now()});
          restored++;
        }
      }
    }catch(e){ /* 照片部分失败不影响文本恢复 */ }
    loadThumbs().then(()=>renderAll());
    toast('已导入 '+recs.length+' 条记录 / '+restored+' 张照片');
  };
  rd.onerror=()=>toast('导入失败：文件读取错误');
  rd.readAsText(f);
});
