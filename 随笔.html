/* ---- 随笔页私有变量（标记区之外） ---- */
:root{ --es-sub:#6b7280; }
[data-theme="dark"]{ --es-sub:#9aa3b2; }

html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;
     display:flex;flex-direction:column;min-height:100vh}
.wrap{max-width:1360px;margin:0 auto;padding:20px 18px calc(40px + env(safe-area-inset-bottom));flex:1;width:100%;box-sizing:border-box}
.head,.es-bar,.es-list,.es-foot{max-width:1000px;margin-left:auto;margin-right:auto}

.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:220px}
.logo{width:36px;height:36px;border-radius:10px;flex:none;display:block;
      background:url(icons/workbench-icon.svg) center/cover no-repeat;
      box-shadow:0 2px 8px rgba(79,124,255,.28)}
.head h1{font-size:26px;font-weight:600;letter-spacing:.01em;line-height:1.25;margin:0}
.head p{font-size:13px;color:var(--es-sub);margin:4px 0 0}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
     background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;transition:background .15s ease,border-color .15s ease}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--pri-deep);border-color:var(--pri-deep);color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.btn:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

.es-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.es-bar input{flex:1;min-width:200px;font:inherit;font-size:13px;padding:8px 14px;border:1px solid var(--line);
      border-radius:999px;background:var(--card);color:var(--ink)}
.es-bar input:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.es-count{font-size:12.5px;color:var(--es-sub)}

.es-list{display:flex;flex-direction:column;gap:12px}
.es-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 20px;
         cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}
.es-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover,0 6px 20px rgba(31,36,48,.12))}
.es-card:focus-visible{outline:2px solid var(--pri);outline-offset:3px}
.es-card h2{margin:0;font-size:16.5px;font-weight:600;color:var(--ink)}
.es-card .snip{font-size:13px;color:var(--es-sub);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.es-card .meta{font-size:12px;color:var(--es-sub);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.es-card .tag{padding:2px 9px;border-radius:999px;background:var(--pri-soft);color:var(--pri-ink);font-size:11.5px}
.es-empty{text-align:center;color:var(--es-sub);font-size:13.5px;border:1px dashed var(--line);border-radius:var(--radius-lg);padding:48px 20px}
.es-foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--es-sub);line-height:1.85}

/* ---- 阅读弹窗 ---- */
.m-mask{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;
        background:rgba(15,19,32,.5);padding:6vh 16px 16px;overflow:auto}
.m-mask.show{display:flex}
.m-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
       width:min(760px,94vw);padding:22px 26px;box-shadow:var(--shadow);margin-bottom:6vh}
.m-box.narrow{width:min(560px,94vw)}
.m-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}

/* ---- Markdown 渲染排版 ---- */
.md{font-size:14.5px;line-height:1.85;color:var(--ink)}
.md h1,.md h2,.md h3{line-height:1.4;margin:1.3em 0 .5em}
.md h1{font-size:22px}.md h2{font-size:18.5px}.md h3{font-size:16px}
.md p{margin:.7em 0}
.md a{color:var(--pri-ink)}
.md code{background:var(--soft);border-radius:6px;padding:2px 6px;font-size:13px;
         font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.md pre{background:var(--soft);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;overflow:auto}
.md pre code{background:none;padding:0}
.md blockquote{margin:.8em 0;padding:4px 14px;border-left:3px solid var(--pri);background:var(--pri-soft);border-radius:0 8px 8px 0;color:var(--ink)}
.md ul,.md ol{padding-left:1.6em;margin:.6em 0}
.md img{max-width:100%;border-radius:var(--radius-sm)}
.md hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
.md table{border-collapse:collapse;margin:.8em 0;width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;font-size:13px;text-align:left}

/* ---- 编辑器 ---- */
.ed-title{width:100%;box-sizing:border-box;font:inherit;font-size:16px;font-weight:600;padding:9px 12px;
          border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card);color:var(--ink);margin-bottom:10px}
.ed-tags{width:100%;box-sizing:border-box;font:inherit;font-size:12.5px;padding:7px 12px;
         border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card);color:var(--ink);margin-bottom:10px}
.ed-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ed-bar .btn.on{background:var(--pri-deep);border-color:var(--pri-deep);color:#fff}
.ed-area{width:100%;box-sizing:border-box;font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
         min-height:44vh;padding:12px;border:1px solid var(--line);border-radius:var(--radius-sm);
         background:var(--card);color:var(--ink);resize:vertical}
.ed-area:focus-visible,.ed-title:focus-visible,.ed-tags:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.ed-hint{font-size:11.5px;color:var(--es-sub);margin-top:6px}

/* ---- 确认弹窗 ---- */
.ask-mask{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(15,19,32,.5)}
.ask-mask.show{display:flex}
.ask-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);width:min(360px,92vw);padding:18px 20px;box-shadow:var(--shadow)}
.ask-box .t{font-size:14.5px;font-weight:600;color:var(--ink)}
.ask-box .b{font-size:13px;color:var(--es-sub);margin-top:6px}
.ask-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);
       background:var(--ink);color:var(--bg);font-size:13px;padding:9px 16px;border-radius:999px;opacity:0;
       transition:opacity .2s ease,transform .2s ease;pointer-events:none;z-index:90;max-width:86vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){.es-card,.toast,.btn{transition:none}.es-card:hover{transform:none}}
</style>
</head>

   DCL 1555ms，中间约 335ms 显示的是没有导航条的旧版布局。
   本文件只负责：当前页高亮 + 站点级 PWA 注册。幂等、零外部依赖。
   - 非吸顶：不与各页 sticky 顶栏抢 top:0
   - 颜色全部取页面自身 CSS 变量，跟随亮/暗主题
   - 同标签跳转（静态链接无 target="_blank"）
   ============================================================ */
(function(){
  if (typeof document === "undefined") return;

  function currentPage(){
    var f = "";
    try { f = decodeURIComponent((location.pathname.split("/").pop() || "index.html")).toLowerCase(); } catch(e){ f = "index.html"; }
    if (!f || f === "index.html") return "tasks";        /* 根入口仍是任务台副本 */
    if (f.indexOf("home") >= 0) return "home";
    if (f.indexOf("任务管理台") >= 0 || f.indexOf("taskhub") >= 0) return "tasks";
    if (f.indexOf("明信片") >= 0 || f.indexOf("postcard") >= 0) return "postcards";
    if (f.indexOf("书影音海报墙") >= 0 || f.indexOf("media") >= 0) return "media";
    if (f.indexOf("观剧") >= 0 || f.indexOf("theatre") >= 0) return "theatre";
    if (f.indexOf("旅行地图") >= 0 || f.indexOf("map") >= 0) return "map";
    if (f.indexOf("随笔") >= 0 || f.indexOf("notes") >= 0) return "notes";
    if (f.indexOf("作品集") >= 0 || f.indexOf("portfolio") >= 0) return "portfolio";
    if (f.indexOf("时间线") >= 0 || f.indexOf("timeline") >= 0) return "timeline";
    return "";
  }

  /* 站点级 PWA：七页共用同一个 sw.js，重复 register 天然幂等；file:// 双击时静默跳过 */
  function registerSW(){
    try{
      if(!("serviceWorker" in navigator)) return;
      if(location.protocol!=="https:" && location.protocol!=="http:") return;
      /* 批三：updateViaCache:"none" —— SW 脚本自身也走 max-age=600，
         默认策略下浏览器可能从 HTTP 缓存拿旧 sw.js，更新检查失效拖 24h。 */
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(function(){});
    }catch(e){}
  }

  function init(){
    var bar = document.getElementById("__wsn_bar");
    if (!bar || bar.getAttribute("data-wsn-ready") === "1") return;
    var cur = currentPage();
    var a = cur ? bar.querySelector('.__wsn_links a[data-page="' + cur + '"]') : null;
    if (a){ a.className = "__wsn_on"; a.setAttribute("aria-current", "page"); }
    bar.setAttribute("data-wsn-ready", "1");
    registerSW();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
/* <<< SITE-NAV:END */</script>
<script>
(function(){
"use strict";
var KEY="wb_notes_v1";
var notes=load();
function load(){
  try{ var raw=localStorage.getItem(KEY); if(raw){ var a=JSON.parse(raw); if(Array.isArray(a)) return a; } }catch(e){}
  return [];
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(notes)); }catch(e){ toast("保存失败：本地存储空间不足（文章过长时可拆篇或导出备份）"); return false; } return true; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._h); toast._h=setTimeout(function(){ t.classList.remove("show"); },2200); }
function pad2(n){ return n<10?"0"+n:String(n); }
function fmtTs(ts){ var d=new Date(ts); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }

/* ---- 安全 Markdown 渲染：先整体转义，再做语法替换（不引入任何未转义原文） ---- */
function renderMd(src){
  var lines=String(src||"").replace(/\r\n?/g,"\n").split("\n");
  var out=[], i=0, inCode=false, codeBuf=[], listStack=[];
  function flushList(){ while(listStack.length){ out.push("</"+listStack.pop()+">"); } }
  function safeUrl(u){
    /* 只放行 http(s)/mailto/站内相对路径，拦 javascript:/vbscript:/data: 等危险 scheme */
    var s=String(u||"").trim();
    if(/^(https?:|mailto:|\/)/i.test(s) || !/^[a-z][a-z0-9+.-]*:/i.test(s)) return s;
    return "";
  }
  function inline(s){
    s=esc(s);
    s=s.replace(/`([^`]+)`/g,function(_,c){ return "<code>"+c+"</code>"; });
    /* u 取自已转义文本（引号已是 &quot;，无法逃出属性），safeUrl 只做 scheme 过滤，勿再转义 */
    s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,function(_,alt,u){
      var ok=safeUrl(u);
      return ok?'<img src="'+ok+'" alt="'+alt+'">':esc("!["+alt+"]("+u+")");
    });
    s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,function(_,t,u){
      var ok=safeUrl(u);
      return ok?'<a href="'+ok+'" target="_blank" rel="noopener noreferrer">'+t+"</a>":esc(t+" ("+u+")");
    });
    s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
    s=s.replace(/\*([^*]+)\*/g,"<em>$1</em>");
    return s;
  }
  for(; i<lines.length; i++){
    var L=lines[i];
    if(/^```/.test(L)){
      if(inCode){ out.push("<pre><code>"+codeBuf.join("\n")+"</code></pre>"); codeBuf=[]; inCode=false; }
      else{ flushList(); inCode=true; }
      continue;
    }
    if(inCode){ codeBuf.push(L); continue; }
    var h=L.match(/^(#{1,3})\s+(.*)$/);
    if(h){ flushList(); out.push("<h"+h[1].length+">"+inline(h[2])+"</h"+h[1].length+">"); continue; }
    if(/^\s*(---+|\*\*\*+)\s*$/.test(L)){ flushList(); out.push("<hr>"); continue; }
    var bq=L.match(/^>\s?(.*)$/);
    if(bq){ flushList(); out.push("<blockquote>"+inline(bq[1])+"</blockquote>"); continue; }
    var ul=L.match(/^\s*[-*]\s+(.*)$/);
    if(ul){ if(listStack[listStack.length-1]!=="ul"){ flushList(); out.push("<ul>"); listStack.push("ul"); } out.push("<li>"+inline(ul[1])+"</li>"); continue; }
    var ol=L.match(/^\s*\d+\.\s+(.*)$/);
    if(ol){ if(listStack[listStack.length-1]!=="ol"){ flushList(); out.push("<ol>"); listStack.push("ol"); } out.push("<li>"+inline(ol[1])+"</li>"); continue; }
    /* 表格行：| a | b | */
    if(/^\s*\|.*\|\s*$/.test(L) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      flushList();
      var rows=[], head=splitRow(L);
      i+=2;
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ rows.push(splitRow(lines[i])); i++; }
      i--;
      out.push("<table><thead><tr>"+head.map(function(c){ return "<th>"+inline(c)+"</th>"; }).join("")+"</tr></thead><tbody>"
        + rows.map(function(r){ return "<tr>"+r.map(function(c){ return "<td>"+inline(c)+"</td>"; }).join("")+"</tr>"; }).join("")+"</tbody></table>");
      continue;
    }
    if(!L.trim()){ flushList(); continue; }
    flushList();
    out.push("<p>"+inline(L)+"</p>");
  }
  if(inCode) out.push("<pre><code>"+codeBuf.join("\n")+"</code></pre>");
  flushList();
  return out.join("\n");
  function splitRow(l){ return l.trim().replace(/^\||\|$/g,"").split("|").map(function(c){ return c.trim(); }); }
}

/* ---- 列表 ---- */
function snippet(md){ var t=renderMd(md).replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim(); return t.slice(0,120); }
function curQ(){ return document.getElementById("esQ").value.trim().toLowerCase(); }
function renderList(){
  var q=curQ();
  var arr=notes.slice().sort(function(a,b){ return (b.updatedAt||0)-(a.updatedAt||0); });
  if(q) arr=arr.filter(function(n){
    var hay=(n.title+" "+(n.tags||[]).join(" ")+" "+n.md).toLowerCase();
    return hay.indexOf(q)>=0;
  });
  var box=document.getElementById("esList");
  var html="";
  arr.forEach(function(n){
    var tags=(n.tags||[]).map(function(t){ return '<span class="tag">'+esc(t)+"</span>"; }).join("");
    html+='<article class="es-card" tabindex="0" role="button" data-id="'+esc(n.id)+'" aria-label="阅读 '+esc(n.title)+'">'
        + "<h2>"+esc(n.title||"无题")+"</h2>"
        + '<div class="snip">'+esc(snippet(n.md))+"</div>"
        + '<div class="meta"><span>'+esc(fmtTs(n.updatedAt||n.createdAt))+"</span>"+tags+"</div></article>";
  });
  box.innerHTML=html;
  document.getElementById("esEmpty").hidden=arr.length>0;
  document.getElementById("esCount").textContent=q?(arr.length+" / "+notes.length+" 篇"):(notes.length+" 篇");
  box.querySelectorAll(".es-card").forEach(function(el){
    el.addEventListener("click",function(){ openRead(el.getAttribute("data-id")); });
    el.addEventListener("keydown",function(ev){ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); openRead(el.getAttribute("data-id")); } });
  });
}

/* ---- 阅读 ---- */
var readId=null, readLastFocus=null;
function openRead(id){
  var n=notes.find(function(x){ return x.id===id; }); if(!n) return;
  readId=id;
  document.getElementById("readBody").innerHTML="<h1>"+esc(n.title||"无题")+"</h1>"+renderMd(n.md);
  readLastFocus=document.activeElement;
  document.getElementById("readMask").classList.add("show");
  document.getElementById("readClose").focus();
}
function closeRead(){
  document.getElementById("readMask").classList.remove("show");
  if(readLastFocus&&readLastFocus.focus) readLastFocus.focus();
  readLastFocus=null;
}

/* ---- 编辑器 ---- */
var edId=null, edLastFocus=null;
function openEditor(n){
  edId=n?n.id:null;
  document.getElementById("edTitle").value=n?n.title||"":"";
  document.getElementById("edTags").value=n?(n.tags||[]).join(", "):"";
  document.getElementById("edArea").value=n?n.md||"":"";
  showTab("edit");
  edLastFocus=document.activeElement;
  document.getElementById("edMask").classList.add("show");
  document.getElementById("edTitle").focus();
}
function showTab(tab){
  var ed=tab==="edit";
  document.getElementById("edTabEdit").setAttribute("aria-pressed",ed?"true":"false");
  document.getElementById("edTabPrev").setAttribute("aria-pressed",ed?"false":"true");
  document.getElementById("edTabEdit").className="btn"+(ed?" on":"");
  document.getElementById("edTabPrev").className="btn"+(ed?"":" on");
  document.getElementById("edArea").hidden=!ed;
  document.getElementById("edPrev").hidden=ed;
  document.getElementById("edPrevHint").hidden=ed;
  if(!ed) document.getElementById("edPrev").innerHTML=renderMd(document.getElementById("edArea").value)||"<p>（空）</p>";
}
function closeEditor(){
  document.getElementById("edMask").classList.remove("show");
  if(edLastFocus&&edLastFocus.focus) edLastFocus.focus();
}
function saveEditor(){
  var title=document.getElementById("edTitle").value.trim()||"无题";
  var tags=document.getElementById("edTags").value.split(/[,，]/).map(function(s){ return s.trim(); }).filter(Boolean);
  var md=document.getElementById("edArea").value.replace(/\s+$/,"");
  if(!md){ toast("正文还是空的"); document.getElementById("edArea").focus(); return; }
  var now=Date.now();
  if(edId){
    var n=notes.find(function(x){ return x.id===edId; });
    n.title=title; n.tags=tags; n.md=md; n.updatedAt=now;
  }else{
    notes.push({id:"n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), title:title, tags:tags, md:md, createdAt:now, updatedAt:now});
  }
  if(save()){ closeEditor(); renderList(); toast("已保存"); }
}

/* ---- 确认弹窗 ---- */
var askResolve=null;
function askConfirm(title,body){
  document.getElementById("askTitle").textContent=title;
  document.getElementById("askBody").textContent=body;
  document.getElementById("askMask").classList.add("show");
  document.getElementById("askOk").focus();
  return new Promise(function(res){ askResolve=res; });
}
function settle(v){
  document.getElementById("askMask").classList.remove("show");
  var r=askResolve; askResolve=null; if(r) r(v);
}

/* ---- 焦点回环 ---- */
function trap(e,maskId){
  var mask=document.getElementById(maskId);
  if(!mask.classList.contains("show")) return false;
  var f=mask.querySelectorAll("button,input,select,textarea,[tabindex='0']");
  if(!f.length) return false;
  var first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); return true; }
  if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); return true; }
  return false;
}

/* ---- 事件绑定 ---- */
document.getElementById("esAdd").addEventListener("click",function(){ openEditor(null); });
document.getElementById("esQ").addEventListener("input",renderList);
document.getElementById("readClose").addEventListener("click",closeRead);
document.getElementById("readEdit").addEventListener("click",function(){
  var n=notes.find(function(x){ return x.id===readId; });
  closeRead(); if(n) openEditor(n);
});
document.getElementById("readDel").addEventListener("click",function(){
  var n=notes.find(function(x){ return x.id===readId; }); if(!n) return;
  askConfirm("删除文章","删除「"+(n.title||"无题")+"」？删除后不可恢复（除非事先导出过备份）。").then(function(ok){
    if(!ok) return;
    notes=notes.filter(function(x){ return x.id!==readId; });
    save(); closeRead(); renderList(); toast("已删除");
  });
});
document.getElementById("edTabEdit").addEventListener("click",function(){ showTab("edit"); });
document.getElementById("edTabPrev").addEventListener("click",function(){ showTab("prev"); });
document.getElementById("edCancel").addEventListener("click",closeEditor);
document.getElementById("edSave").addEventListener("click",saveEditor);
document.getElementById("askOk").addEventListener("click",function(){ settle(true); });
document.getElementById("askCancel").addEventListener("click",function(){ settle(false); });
document.getElementById("readMask").addEventListener("click",function(e){ if(e.target.id==="readMask") closeRead(); });
document.getElementById("edMask").addEventListener("click",function(e){ if(e.target.id==="edMask") closeEditor(); });
document.getElementById("askMask").addEventListener("click",function(e){ if(e.target.id==="askMask") settle(false); });

document.addEventListener("keydown",function(e){
  if(e.key==="Tab"){
    if(trap(e,"readMask")||trap(e,"edMask")||trap(e,"askMask")) return;
    return;
  }
  if(e.key!=="Escape") return;
  if(document.getElementById("askMask").classList.contains("show")){ settle(false); return; }
  if(document.getElementById("edMask").classList.contains("show")){ askConfirm("放弃编辑","尚未保存的内容将丢失，确定关闭编辑器？").then(function(ok){ if(ok) closeEditor(); }); return; }
  if(document.getElementById("readMask").classList.contains("show")){ closeRead(); return; }
});

/* ---- 导出 / 导入 ---- */
document.getElementById("esExport").addEventListener("click",function(){
  var blob=new Blob([JSON.stringify({app:"workbuddy-notes",ver:1,data:notes},null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="随笔_全量_"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ try{ URL.revokeObjectURL(a.href); }catch(e){} },1200);
  toast("已导出 "+notes.length+" 篇");
});
document.getElementById("esImport").addEventListener("click",function(){
  var inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var j=JSON.parse(rd.result);
        var arr=j&&j.data&&Array.isArray(j.data.data)?j.data.data:(Array.isArray(j.data)?j.data:null);
        if(!arr) throw 0;
        askConfirm("导入文章","将导入 "+arr.length+" 篇（同 id 的现有文章会被覆盖），继续？").then(function(ok){
          if(!ok) return;
          arr.forEach(function(im){
            var ix=notes.findIndex(function(x){ return x.id===im.id; });
            if(ix>=0) notes[ix]=im; else notes.push(im);
          });
          save(); renderList(); toast("已导入");
        });
      }catch(e){ toast("文件格式不正确，导入取消"); }
    };
    rd.readAsText(f);
  };
  inp.click();
});

renderList();
})();
</script>
